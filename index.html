<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriMandi - Farmer Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c8e6c9
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        /* =========================
           LOGIN CARD
        ========================== */

        .login-container {

            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }


        /* =========================
           LOGO
        ========================== */

        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #2e7d32;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* =========================
           FORM GROUP
        ========================== */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }


        input:focus {

            border-color: #2e7d32;

            box-shadow:
                0 0 0 2px
                rgba(46, 125, 50, 0.1);
        }


        /* =========================
           MOBILE + SEND OTP
        ========================== */

        .mobile-box {

            display: flex;

            gap: 10px;
        }


        .mobile-box input {

            flex: 1;
        }


        .send-btn {

            width: 110px;

            border: none;

            border-radius: 8px;

            background: #2e7d32;

            color: white;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .send-btn:hover {

            background: #1b5e20;
        }


        .send-btn:disabled {

            background: #9e9e9e;

            cursor: not-allowed;
        }


        /* =========================
           OTP INPUT
        ========================== */

        .otp-input {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            letter-spacing: 8px;
        }


        .otp-hint {

            font-size: 12px;

            color: #777;

            margin-top: 7px;
        }


        /* =========================
           VERIFY BUTTON
        ========================== */

        .verify-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #388e3c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }


        .verify-btn:hover {

            background: #1b5e20;
        }


        /* =========================
           RESEND
        ========================== */

        .resend-section {

            text-align: center;

            margin-top: 15px;

            font-size: 13px;

            color: #777;
        }


        .resend-btn {

            border: none;

            background: none;

            color: #2e7d32;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        .resend-btn:disabled {

            color: #999;

            cursor: not-allowed;
        }


        /* =========================
           STATUS
        ========================== */

        .status {

            text-align: center;

            margin-top: 15px;

            font-size: 13px;

            min-height: 18px;
        }


        .success {

            color: #2e7d32;
        }


        .error {

            color: #d32f2f;
        }


        /* =========================
           CREATE ACCOUNT
        ========================== */

        .create-account {

            text-align: center;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

            color: #666;

            font-size: 14px;
        }


        .create-account a {

            color: #2e7d32;

            font-weight: bold;

            text-decoration: none;
        }


        .create-account a:hover {

            text-decoration: underline;
        }


        /* =========================
           SECURITY
        ========================== */

        .security {

            margin-top: 20px;

            padding: 12px;

            background: #f1f8e9;

            border-radius: 8px;

            color: #666;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer {

            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #999;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .login-container {

                padding: 30px 22px;
            }

            .logo {

                font-size: 28px;
            }

            .mobile-box {

                flex-direction: column;
            }

            .send-btn {

                width: 100%;

                padding: 13px;
            }

            .create-account-link {
                display: inline-block;
                color: #2e7d32;
                font-weight: bold;
                text-decoration: none;
                cursor: pointer;
                padding: 5px 8px;
            }

            .create-account-link:hover {
                color: #1b5e20;
                text-decoration: underline;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">

            🌱 AgriMandi

        </div>


        <div class="subtitle">

            Smart Mandi Price Comparison for Farmers

        </div>


        <!-- =========================
             MOBILE NUMBER
        ========================== -->

        <div class="form-group">

            <label for="mobile">

                Mobile Number

            </label>


            <div class="mobile-box">

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                >


                <button
                    type="button"
                    class="send-btn"
                    id="sendOtpBtn"
                    onclick="sendOTP()"
                >

                    Send OTP

                </button>

            </div>

        </div>


        <!-- =========================
             OTP
        ========================== -->

        <div class="form-group">

            <label for="otp">

                Enter OTP

            </label>


            <input
                type="text"
                id="otp"
                class="otp-input"
                placeholder="------"
                maxlength="6"
                inputmode="numeric"
            >


            <div class="otp-hint">

                Enter the 6-digit OTP sent to your mobile number.

            </div>

        </div>


        <!-- =========================
             VERIFY
        ========================== -->

        <button
            type="button"
            class="verify-btn"
            onclick="verifyOTP()"
        >

            ✓ Verify OTP & Login

        </button>


        <!-- =========================
             RESEND
        ========================== -->

        <div class="resend-section">

            <span id="timer">

                Didn't receive OTP?

            </span>


            <br>


            <button
                type="button"
                class="resend-btn"
                id="resendBtn"
                onclick="resendOTP()"
                disabled
            >

                Resend OTP

            </button>

        </div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        >

        </div>


        <!-- =========================
             CREATE ACCOUNT
        ========================== -->

        <div class="create-account">

            Don't have an account?

            <a href="CreateAccount.html" class="create-account-link">
                Create Account
            </a>

        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Your account information is protected.

            <br>

            Login securely using your mobile number
            and OTP.

        </div>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 AgriMandi |
            Farmer Support Platform

        </div>


    </div>


    <script>

        let generatedOTP = "";

        let timerInterval;

        let timeLeft = 30;


        /* =========================
           SEND OTP
        ========================== */

        function sendOTP() {

            const mobile =
                document
                .getElementById("mobile")
                .value
                .trim();


            const status =
                document
                .getElementById("status");


            /* Validate Mobile */

            if (!/^[6-9][0-9]{9}$/.test(mobile)) {

                status.innerHTML =
                    "❌ Enter a valid 10-digit mobile number.";

                status.className =
                    "status error";

                return;
            }


            /* Generate OTP */

            generatedOTP =
                Math.floor(
                    100000 +
                    Math.random() * 900000
                ).toString();


            /*
                DEMO OTP

                In actual project,
                OTP will be sent through
                backend/SMS service.
            */

            console.log(
                "Demo OTP:",
                generatedOTP
            );


            status.innerHTML =
                "✓ OTP sent successfully.";

            status.className =
                "status success";


            document
                .getElementById("sendOtpBtn")
                .disabled = true;


            /* Start timer */

            startTimer();


            /*
                DEMO ONLY
                Remove this alert when
                backend SMS is connected.
            */

            alert(
                "Demo OTP: " +
                generatedOTP
            );

            

        }


        /* =========================
           TIMER
        ========================== */

        function startTimer() {

            timeLeft = 30;

            const timer =
                document
                .getElementById("timer");

            const resend =
                document
                .getElementById("resendBtn");


            resend.disabled = true;


            clearInterval(timerInterval);


            timerInterval =
                setInterval(function() {

                    timeLeft--;


                    timer.innerHTML =
                        "Resend OTP in "
                        + timeLeft
                        + " seconds";


                    if (timeLeft <= 0) {

                        clearInterval(
                            timerInterval
                        );


                        timer.innerHTML =
                            "You can request a new OTP";


                        resend.disabled =
                            false;

                    }

                }, 1000);

        }


        /* =========================
           RESEND OTP
        ========================== */

        function resendOTP() {

            const mobile =
                document
                .getElementById("mobile")
                .value
                .trim();


            if (!/^[6-9][0-9]{9}$/.test(mobile)) {

                alert(
                    "Please enter a valid mobile number."
                );

                return;
            }


            generatedOTP =
                Math.floor(
                    100000 +
                    Math.random() * 900000
                ).toString();


            console.log(
                "New Demo OTP:",
                generatedOTP
            );


            alert(
                "New Demo OTP: " +
                generatedOTP
            );


            document
                .getElementById("status")
                .innerHTML =
                "✓ New OTP sent successfully.";


            document
                .getElementById("status")
                .className =
                "status success";


            startTimer();

        }


        /* =========================
           VERIFY OTP
        ========================== */

        function verifyOTP() {

            const mobile =
                document
                .getElementById("mobile")
                .value
                .trim();


            const enteredOTP =
                document
                .getElementById("otp")
                .value
                .trim();


            const status =
                document
                .getElementById("status");


            /* Validate Mobile */

            if (!/^[6-9][0-9]{9}$/.test(mobile)) {

                status.innerHTML =
                    "❌ Please enter a valid mobile number.";

                status.className =
                    "status error";

                return;
            }


            /* Check OTP */

            if (!/^[0-9]{6}$/.test(enteredOTP)) {

                status.innerHTML =
                    "❌ Please enter a valid 6-digit OTP.";

                status.className =
                    "status error";

                return;
            }


            if (enteredOTP !== generatedOTP) {

                status.innerHTML =
                    "❌ Incorrect OTP. Please try again.";

                status.className =
                    "status error";

                return;
            }


            /* Successful Login */

            status.innerHTML =
                "✓ OTP verified successfully!";

            status.className =
                "status success";


            /* Save Login */

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            localStorage.setItem(
                "farmerMobile",
                mobile
            );


            /* Redirect to Dashboard */

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 1000);

        }

    </script>


</body>

</html>
